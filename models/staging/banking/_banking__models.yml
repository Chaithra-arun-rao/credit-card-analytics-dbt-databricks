version: 2

models:

  - name: stg_banking__customers
    description: "Cleaned customer master data"

    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: risk_rating
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - LOW
                  - MEDIUM
                  - HIGH


  - name: stg_banking__credit_cards
    description: "Cleaned credit card master data"

    columns:
      - name: card_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_banking__customers')
                field: customer_id

      - name: card_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - ACTIVE
                  - BLOCKED


  - name: stg_banking__merchants
    description: "Cleaned merchant master data"

    columns:
      - name: merchant_id
        data_tests:
          - not_null
          - unique


  - name: stg_banking__transactions
    description: "Cleaned credit card transaction data"

    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - unique

      - name: card_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_banking__credit_cards')
                field: card_id

      - name: merchant_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_banking__merchants')
                field: merchant_id

      - name: transaction_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - SUCCESS
                  - DECLINED
                  - REVERSED
                  - PENDING


  - name: stg_banking__card_payments
    description: "Cleaned credit card payment data"

    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

      - name: card_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_banking__credit_cards')
                field: card_id